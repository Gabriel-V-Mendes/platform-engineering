apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "microservice.fullname" . }}-config"
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ .Chart.Name | quote }}
  ENVIRONMENT: {{ .Values.env.ENVIRONMENT | default "production" | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | default "INFO" | quote }}
