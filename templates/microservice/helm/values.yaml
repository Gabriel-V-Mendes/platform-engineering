# ==============================================================================
# Helm Values — Golden Path Microservice Standard
# ==============================================================================
owner: "{{SERVICE_OWNER}}"
replicaCount: 2

image:
  repository: "ghcr.io/org/{{SERVICE_NAME}}"
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 8080 # SERVICE_PORT
  targetPort: 8080 # SERVICE_PORT

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 10001

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: "{{SERVICE_NAME}}.internal.empresa.local"
      paths:
        - path: /
          pathType: Prefix

env:
  LOG_LEVEL: INFO
  ENVIRONMENT: production
