name: Reusable Helm Workflow

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: "Nome do microsservico"
      chart-path:
        required: false
        type: string
        default: "helm"
        description: "Caminho do Helm Chart"

permissions:
  contents: read

jobs:
  helm-lint-and-template:
    name: Helm Lint & Render (${{ inputs.service-name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Helm Lint
        run: |
          helm lint ${{ inputs.chart-path }}

      - name: Helm Template (Dry-Run Render)
        run: |
          helm template ci-test-release ${{ inputs.chart-path }} --dry-run
