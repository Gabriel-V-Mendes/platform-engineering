name: Reusable Security Workflow

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: "Nome do microsservico para auditoria de seguranca"
      dockerfile-path:
        required: false
        type: string
        default: "app/Dockerfile"
        description: "Caminho do Dockerfile"

permissions:
  contents: read

jobs:
  gitleaks-scan:
    name: Gitleaks Scan (${{ inputs.service-name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Executar Gitleaks no Historico Git
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
