name: Platform & IDP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Seguranca: Gitleaks no historico completo
  # ============================================================================
  security-audit:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 2. Validacao do Modulo Terraform
  # ============================================================================
  terraform-validation:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.4

      - name: Validar Modulo de Infraestrutura
        run: |
          cd terraform/modules/microservice-infra
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Validar Exemplo de Consumo Versionado
        run: |
          cd terraform/examples/consumer-service
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  # ============================================================================
  # 3. Teste do Template Golden Path e Verificacao E2E (< 30 minutos)
  # ============================================================================
  golden-path-verification:
    name: Golden Path E2E Test & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Executar Suite de Testes e Criacao de Servico
        run: |
          chmod +x scripts/*.sh
          ./scripts/verify-golden-path.sh

  # ============================================================================
  # 4. Validacao da Documentacao MkDocs
  # ============================================================================
  mkdocs-build:
    name: MkDocs Documentation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar MkDocs Material
        run: pip install mkdocs-material

      - name: Build do Portal MkDocs
        run: mkdocs build --strict
