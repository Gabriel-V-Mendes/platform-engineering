name: Reusable CI Workflow

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: "Nome do microsservico"
      python-version:
        required: false
        type: string
        default: "3.12"
        description: "Versao do Python utilizada"
      coverage-threshold:
        required: false
        type: number
        default: 90
        description: "Percentual minimo de cobertura exigido"
      app-dir:
        required: false
        type: string
        default: "app"
        description: "Diretorio do codigo da aplicacao"
      build-docker:
        required: false
        type: boolean
        default: true
        description: "Se deve construir e testar a imagem Docker"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Pytest (${{ inputs.service-name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ inputs.app-dir }}/requirements-dev.txt

      - name: Lint com Ruff
        run: |
          ruff check ${{ inputs.app-dir }}/src ${{ inputs.app-dir }}/tests

      - name: Executar Testes Unitarios com Cobertura
        run: |
          cd ${{ inputs.app-dir }}
          pytest -v --cov=src --cov-fail-under=${{ inputs.coverage-threshold }}

  docker-build:
    name: Docker Build (${{ inputs.service-name }})
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: inputs.build-docker
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build da Imagem Docker Multi-Stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.app-dir }}
          push: false
          tags: ${{ inputs.service-name }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
